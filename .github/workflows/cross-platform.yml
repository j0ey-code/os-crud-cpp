name: cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # Git Bash on Windows, so one script covers all three platforms.
      - name: Smoke tests
        shell: bash
        run: |
          exe=build/filemgr
          if [ -f build/Release/filemgr.exe ]; then exe=build/Release/filemgr.exe; fi
          tests/smoke_test.sh "$exe"
